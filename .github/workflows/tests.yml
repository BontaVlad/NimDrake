name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.nimble'
      - 'justfile'
      - 'config.nims'
      - 'lsan.supp'
      - '.github/workflows/tests.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.nimble'
      - 'justfile'
      - 'config.nims'
      - 'lsan.supp'
      - '.github/workflows/tests.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    env:
      NIMBLE_USE_SYSTEM_NIM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-git
            unzip

      - name: Install DuckDB
        uses: ./.github/actions/install-duckdb
        with:
          cache-suffix: tests
          msys2-shell: ${{ runner.os == 'Windows' }}

      - name: Setup Nim
        uses: ./.github/actions/setup-nim
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          msys2-shell: ${{ runner.os == 'Windows' }}

      - name: Test
        if: runner.os != 'Windows'
        run: just test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: just --set asan 0 --set leaks false test
