name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.nimble'
      - 'justfile'
      - 'config.nims'
      - 'lsan.supp'
      - '.github/workflows/tests.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.nimble'
      - 'justfile'
      - 'config.nims'
      - 'lsan.supp'
      - '.github/workflows/tests.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    env:
      NIMBLE_USE_SYSTEM_NIM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-git
            unzip

      - name: Install DuckDB
        uses: ./.github/actions/install-duckdb
        with:
          cache-suffix: tests
          msys2-shell: ${{ runner.os == 'Windows' }}

      - name: Setup Nim
        uses: ./.github/actions/setup-nim
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          msys2-shell: ${{ runner.os == 'Windows' }}

      - name: Test
        if: runner.os != 'Windows'
        run: just test

      - name: Diagnose (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -x
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== duckdb.dll on disk ==="
          ls -la /mingw64/bin/duckdb.dll 2>&1 || true
          ls -la /mingw64/lib/libduckdb.lib 2>&1 || true
          echo "=== nim / gcc ==="
          nim -v | head -2
          which gcc
          echo "=== compile one test (no -r) ==="
          mkdir -p nimcache/tests/test_aggregate_functions
          nim c --verbosity:0 --hints:off --mm:orc --excessiveStackTrace:on \
            -d:debug -d:nimDebugDlOpen --opt:none --debuginfo:on --debugger:native \
            -d:useMalloc -d:noSignalHandler --passC:-O0 --passC:-g3 \
            -o:nimcache/tests/test_aggregate_functions/test_aggregate_functions.exe \
            tests/test_aggregate_functions.nim
          echo "compile exit=$?"
          echo "=== DLL dependencies of exe ==="
          objdump -p nimcache/tests/test_aggregate_functions/test_aggregate_functions.exe | grep "DLL Name"
          echo "=== run exe directly ==="
          ./nimcache/tests/test_aggregate_functions/test_aggregate_functions.exe
          echo "run exit=$?"

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: just --set asan 0 --set leaks false test
