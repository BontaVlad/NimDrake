name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - '*.nimble'
      - '.github/workflows/docs.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - '*.nimble'
      - '.github/workflows/docs.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB
        uses: ./.github/actions/install-duckdb
        with:
          cache-suffix: docs

      - name: Setup Nim
        uses: ./.github/actions/setup-nim
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cookbook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
          nimble install -y --useSystemNim nimibook

      - name: Build cookbook (runs every snippet)
        working-directory: docs/cookbook
        run: |
          nim r nbook.nim init
          nim r nbook.nim build --mm:arc

      - name: Generate API docs
        run: |
          nimble doc --docCmd:skip --project --outdir:docs src/nimdrake.nim
          mv docs/theindex.html docs/index.html
          touch docs/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
